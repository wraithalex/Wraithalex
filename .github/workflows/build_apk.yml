name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install SVG converter tool
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Prepare Flutter Project & Generate Assets
        run: |
          flutter create temp_app --project-name=nbrb_rates --platforms=android --org=com.example.nbrb
          cp -f pubspec.yaml temp_app/pubspec.yaml
          cp -rf lib/* temp_app/lib/
          
          mkdir -p assets
          mkdir -p temp_app/assets
          
          rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon.png
          cp assets/icon.png temp_app/assets/icon.png
          
          if [ -d "android" ]; then cp -rf android/* temp_app/android/; fi
          
          cd temp_app
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbrb-app-release
          path: app-release.apk
